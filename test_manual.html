<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
</head>
<body>
    <h1>Quick Message Test</h1>
    <div id="output"></div>
    
    <script>
        function log(msg) {
            document.getElementById('output').innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + msg + '</p>';
        }
        
        async function runTest() {
            log('Starting test...');
            
            // Try to login as pablo (ID=1)
            try {
                log('1. Login attempt...');
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'pablo@pablo.pablo', 
                        password: 'password' 
                    }),
                    credentials: 'include'
                });
                
                log('Login status: ' + loginResponse.status);
                const loginResult = await loginResponse.text();
                log('Login result: ' + loginResult);
                
                if (loginResponse.ok) {
                    // Try to send message to user 2
                    log('2. Sending message...');
                    const messageResponse = await fetch('/api/messages/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            recipient_id: 2, 
                            text: 'Test message from JS' 
                        }),
                        credentials: 'include'
                    });
                    
                    log('Message status: ' + messageResponse.status);
                    const messageResult = await messageResponse.text();
                    log('Message result: ' + messageResult);
                }
                
            } catch (error) {
                log('Error: ' + error.message);
            }
        }
        
        // Auto-run test when page loads
        window.onload = runTest;
    </script>
</body>
</html>
