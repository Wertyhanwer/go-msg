<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Friendship</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; min-height: 100px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        button { margin: 5px; padding: 5px 10px; }
        input { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <h1>Debug Friendship System</h1>
    
    <div class="section">
        <h3>1. Информация о пользователях</h3>
        <button onclick="debugCurrentUser()">Текущий пользователь</button>
        <button onclick="getAllUsers()">Все пользователи</button>
        <div id="usersLog" class="log"></div>
    </div>

    <div class="section">
        <h3>2. Состояние дружбы</h3>
        <input type="number" id="userId1" placeholder="User ID 1" value="1">
        <input type="number" id="userId2" placeholder="User ID 2" value="2">
        <button onclick="checkFriendshipRaw()">Проверить дружбу (API)</button>
        <button onclick="getFriendsForUser()">Получить друзей пользователя 1</button>
        <button onclick="debugFriendsTable()">Показать таблицу friends</button>
        <div id="friendshipLog" class="log"></div>
    </div>

    <div class="section">
        <h3>3. Тест отправки сообщения</h3>
        <input type="text" id="messageText" placeholder="Текст сообщения" value="Test message">
        <button onclick="testSendMessage()">Отправить сообщение</button>
        <div id="messageLog" class="log"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            const time = new Date().toLocaleTimeString();
            const className = isError ? 'error' : 'success';
            element.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        async function debugCurrentUser() {
            clearLog('usersLog');
            try {
                const response = await fetch(`${API_BASE}/auth/user`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const user = await response.json();
                    log('usersLog', `Текущий пользователь: ID=${user.id}, Имя=${user.first_name} ${user.last_name}, Email=${user.email}`);
                } else {
                    const error = await response.text();
                    log('usersLog', `Ошибка получения текущего пользователя: ${error}`, true);
                }
            } catch (error) {
                log('usersLog', `Ошибка сети: ${error.message}`, true);
            }
        }

        async function getAllUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const users = await response.json();
                    log('usersLog', `Всего пользователей: ${users.length}`);
                    users.forEach(user => {
                        log('usersLog', `ID=${user.id}, Имя=${user.first_name} ${user.last_name}, Email=${user.email}`);
                    });
                } else {
                    const error = await response.text();
                    log('usersLog', `Ошибка получения пользователей: ${error}`, true);
                }
            } catch (error) {
                log('usersLog', `Ошибка сети: ${error.message}`, true);
            }
        }

        async function checkFriendshipRaw() {
            clearLog('friendshipLog');
            const userId1 = document.getElementById('userId1').value;
            const userId2 = document.getElementById('userId2').value;

            try {
                const response = await fetch(`${API_BASE}/friends/status?friend_id=${userId2}`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    log('friendshipLog', `Статус дружбы между ${userId1} и ${userId2}: ${result.status}`);
                } else {
                    const error = await response.text();
                    log('friendshipLog', `Ошибка проверки дружбы: ${error}`, true);
                }
            } catch (error) {
                log('friendshipLog', `Ошибка сети: ${error.message}`, true);
            }
        }

        async function getFriendsForUser() {
            try {
                const response = await fetch(`${API_BASE}/friends`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const friends = await response.json();
                    log('friendshipLog', `Друзей в списке: ${friends.length}`);
                    friends.forEach(friend => {
                        log('friendshipLog', `Друг: ID=${friend.friend_id}, Имя=${friend.first_name} ${friend.last_name}`);
                    });
                } else {
                    const error = await response.text();
                    log('friendshipLog', `Ошибка получения друзей: ${error}`, true);
                }
            } catch (error) {
                log('friendshipLog', `Ошибка сети: ${error.message}`, true);
            }
        }

        async function testSendMessage() {
            clearLog('messageLog');
            const userId2 = document.getElementById('userId2').value;
            const messageText = document.getElementById('messageText').value;

            try {
                const response = await fetch(`${API_BASE}/messages/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        recipient_id: parseInt(userId2), 
                        text: messageText 
                    }),
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    log('messageLog', `✅ Сообщение отправлено: ID=${result.id}`);
                } else {
                    const error = await response.text();
                    log('messageLog', `❌ Ошибка отправки сообщения: ${error}`, true);
                }
            } catch (error) {
                log('messageLog', `❌ Ошибка сети: ${error.message}`, true);
            }
        }

        async function debugFriendsTable() {
            try {
                const response = await fetch(`${API_BASE}/friends/debug`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const result = await response.json();
                    log('friendshipLog', `📊 Записей в таблице friends: ${result.friends_count}`);
                    result.friends.forEach(friend => {
                        log('friendshipLog', `ID=${friend.id}, user_id=${friend.user_id}, friend_id=${friend.friend_id}, status=${friend.status}`);
                    });
                } else {
                    const error = await response.text();
                    log('friendshipLog', `❌ Ошибка получения отладочной информации: ${error}`, true);
                }
            } catch (error) {
                log('friendshipLog', `❌ Ошибка сети: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
