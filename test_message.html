<!DOCTYPE html>
<html>
<head>
    <title>Test Message Sending</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; }
        button { padding: 10px 20px; margin: 5px; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Test Message Sending</h2>
        
        <div>
            <h3>Step 1: Login</h3>
            <button onclick="login()">Login as pablo (ID=1)</button>
            <button onclick="loginAsUser2()">Login as Test User (ID=2)</button>
        </div>
        
        <div>
            <h3>Step 2: Send Message</h3>
            <input type="number" id="recipientId" placeholder="Recipient ID" value="2">
            <input type="text" id="messageText" placeholder="Message text" value="Test message from pablo">
            <button onclick="sendMessage()">Send Message</button>
        </div>
        
        <div>
            <h3>Step 3: Check Results</h3>
            <button onclick="checkFriendship()">Check Friendship (1 and 2)</button>
            <button onclick="getCurrentUser()">Get Current User</button>
        </div>
        
        <div id="log" class="log">Log output will appear here...</div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }

        async function login() {
            try {
                log('Logging in as pablo...');
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'pablo@pablo.pablo', 
                        password: 'password' 
                    }),
                    credentials: 'include'
                });
                
                const result = await response.text();
                log('Login response: ' + response.status + ' - ' + result);
            } catch (error) {
                log('Login error: ' + error.message);
            }
        }

        async function loginAsUser2() {
            try {
                log('Logging in as Test User...');
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'test@example.com', 
                        password: 'password' 
                    }),
                    credentials: 'include'
                });
                
                const result = await response.text();
                log('Login response: ' + response.status + ' - ' + result);
            } catch (error) {
                log('Login error: ' + error.message);
            }
        }

        async function sendMessage() {
            try {
                const recipientId = document.getElementById('recipientId').value;
                const text = document.getElementById('messageText').value;
                
                log(`Sending message to user ${recipientId}: "${text}"`);
                const response = await fetch('/api/messages/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        recipient_id: parseInt(recipientId), 
                        text: text 
                    }),
                    credentials: 'include'
                });
                
                const result = await response.text();
                log('Send message response: ' + response.status + ' - ' + result);
            } catch (error) {
                log('Send message error: ' + error.message);
            }
        }

        async function checkFriendship() {
            try {
                log('Checking friendship status...');
                const response = await fetch('/api/friends/status?friend_id=2', {
                    credentials: 'include'
                });
                
                const result = await response.text();
                log('Friendship status: ' + response.status + ' - ' + result);
            } catch (error) {
                log('Friendship check error: ' + error.message);
            }
        }

        async function getCurrentUser() {
            try {
                log('Getting current user...');
                const response = await fetch('/api/auth/user', {
                    credentials: 'include'
                });
                
                const result = await response.text();
                log('Current user: ' + response.status + ' - ' + result);
            } catch (error) {
                log('Get user error: ' + error.message);
            }
        }

        // Clear log on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('log').textContent = '';
            log('Test page loaded. Ready to test message sending.');
        });
    </script>
</body>
</html>
