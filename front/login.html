<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="source/styles/registration-login.css">
    <title>Login</title>
</head>
<body>
    <form class="register-form px-3" id="loginForm">
        <div class="register-logo">
            <img src="source/images/image.png" alt="Logo">
        </div>
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
        <input type="password" id="password" class="form-control" placeholder="Введите пароль" required>
        <button type="submit" class="btn">Войти</button>
        <div id="errorMessage" class="text-center mt-2" style="color: white; display: none;"></div>
        <div class="text-center mt-3">
            <small class="fs-6 text-white">Нет аккаунта? <a href="registration.html" class="text-white text-decoration-underline">Зарегистрироваться</a></small>
        </div>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка при входе';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
