<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="source/styles/registration-login.css">
    <title>Registration</title>
</head>

<body>
    <form class="register-form px-3" id="registerForm">
        <div class="register-logo">
            <img src="source/images/image.png" alt="Logo">
        </div>
        <input type="text" id="firstName" class="form-control" placeholder="Имя" required>
        <input type="text" id="lastName" class="form-control" placeholder="Фамилия" required>
        <input type="email" id="email" class="form-control" placeholder="E-mail" required>
        <input type="password" id="password" class="form-control" placeholder="Введите пароль" required>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
        <button type="submit" class="btn">Зарегистрироваться</button>
        <div id="errorMessage" class="text-center mt-2" style="color: white; display: none;"></div>
        <div class="text-center mt-3">
            <small class="fs-6 text-white"> Уже есть аккаунт? <a href="login.html" class="text-white text-decoration-underline">Войти</a></small>
        </div>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Пароли не совпадают';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка при регистрации';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
