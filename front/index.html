<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="source/styles/my-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Dialogues</title>
</head>

<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <div>
                    <div class="d-flex align-items-center">
                        <!-- Current user info -->
                        <div class="list-group-item d-flex align-items-center border-0 mb-2" style="background: transparent; margin-bottom: 0 !important;">
                            <div class="rounded-circle text-primary border d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" id="userAvatar">?</div>
                            <div class="ms-3">
                                <strong id="userName">Загрузка...</strong>
                            </div>
                        </div>
                        <a href="#" onclick="logout()" class="text-primary ms-3 fw-bold" style="text-decoration: underline;">Выйти</a>
                    </div>
                    <!-- Search form -->
                    <div class="d-flex align-items-center mt-2">
                        <form class="d-flex ms-2" role="search" id="searchForm">
                            <input class="form-control me-2" type="search" placeholder="Поиск пользователей" aria-label="Поиск" id="searchInput">
                            <button type="button" onclick="showAddFriends()" class="btn btn-primary btn-sm me-2">
                                <span>+</span>
                            </button>
                            <a href="#" onclick="loadContacts()"><img src="source/images/contacts.png" alt="contacts" class="contacts-icon"></a>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section>
        <div class="container-fluid">
            <div class="row g-0">
                <!-- Contacts sidebar -->
                <div class="col-md-4 bg-light" style="height: calc(100vh - 120px); overflow-y: auto;">
                    <div id="contactsList">
                        <div class="text-center p-3">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Загрузка контактов...</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Pending requests section -->
                    <div id="pendingSection" style="display: none;">
                        <div class="border-top p-2 bg-warning bg-opacity-10">
                            <small class="text-muted">
                                <strong>Заявки в друзья</strong>
                                <span id="pendingCount" class="badge bg-warning ms-1">0</span>
                            </small>
                        </div>
                        <div id="pendingList"></div>
                    </div>
                </div>
                
                <!-- Chat area -->
                <div class="col-md-8" style="height: calc(100vh - 120px); display: flex; flex-direction: column;">
                    <div id="chatArea" style="display: none; flex: 1; flex-direction: column;">
                        <!-- Chat header -->
                        <div class="border-bottom p-3 bg-white">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle text-primary border d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" id="chatAvatar">?</div>
                                <div class="ms-3">
                                    <strong id="chatUserName">Выберите контакт</strong>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Messages area -->
                        <div id="messagesArea" class="flex-fill p-3" style="overflow-y: auto; height: calc(100vh - 220px);">
                            <!-- Messages will be loaded here -->
                        </div>
                        
                        <!-- Message input -->
                        <div class="border-top p-3 bg-white">
                            <form id="messageForm" class="d-flex">
                                <input type="text" id="messageInput" class="form-control me-2" placeholder="Введите сообщение..." required>
                                <button type="submit" class="btn btn-primary">Отправить</button>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Welcome message -->
                    <div id="welcomeMessage" class="d-flex align-items-center justify-content-center h-100">
                        <div class="text-center">
                            <h4 class="text-muted">Добро пожаловать в чат!</h4>
                            <p class="text-muted">Выберите контакт для начала переписки</p>
                            <button type="button" class="btn btn-primary" onclick="showAddFriends()">
                                Найти друзей
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Add Friends Modal -->
    <div class="modal fade" id="addFriendsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Поиск пользователей</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="userSearchInput" placeholder="Введите имя, фамилию или email">
                    </div>
                    <div id="searchResults">
                        <div class="text-center text-muted">
                            Введите запрос для поиска пользователей
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        let currentUser = null;
        let selectedRecipient = null;
        let contacts = [];
        let searchTimeout = null;

        // Check authentication on page load
        window.onload = async function() {
            await checkAuth();
            await loadContacts();
            await loadPendingRequests();
        };

        // Check if user is authenticated
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/user');
                const data = await response.json();
                
                if (data.success) {
                    currentUser = data.user;
                    updateUserDisplay();
                } else {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        }

        // Update user display in header
        function updateUserDisplay() {
            if (currentUser) {
                const avatar = document.getElementById('userAvatar');
                const userName = document.getElementById('userName');
                
                avatar.textContent = currentUser.first_name.charAt(0).toUpperCase();
                userName.textContent = `${currentUser.first_name} ${currentUser.last_name}`;
            }
        }

        // Load contacts list (friends)
        async function loadContacts() {
            try {
                console.log('Loading contacts...');
                const response = await fetch('/api/friends');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                contacts = await response.json();
                console.log('Loaded contacts:', contacts);
                
                // Ensure contacts is an array
                if (!Array.isArray(contacts)) {
                    console.warn('Contacts is not an array:', contacts);
                    contacts = [];
                }
                
                const contactsList = document.getElementById('contactsList');
                
                if (contacts.length === 0) {
                    console.log('No contacts found');
                    contactsList.innerHTML = `
                        <div class="text-center p-3 text-muted">
                            <p>У вас пока нет друзей</p>
                            <button type="button" class="btn btn-primary btn-sm" onclick="showAddFriends()">
                                Найти друзей
                            </button>
                        </div>`;
                    return;
                }
                
                console.log('Rendering contacts:', contacts.length);
                contactsList.innerHTML = contacts.map(contact => `
                    <a href="#" onclick="selectContact(${contact.id})" 
                       class="list-group-item list-group-item-action d-flex align-items-center border-0 border-bottom mb-2 contact-item" 
                       data-contact-id="${contact.id}">
                        <div class="rounded-circle text-primary border-primary border d-flex align-items-center justify-content-center" 
                             style="width: 40px; height: 40px;">
                            ${contact.first_name.charAt(0).toUpperCase()}
                        </div>
                        <div class="ms-3">
                            <strong>${contact.first_name} ${contact.last_name}</strong>
                            <div class="small text-muted">${contact.email}</div>
                        </div>
                    </a>
                `).join('');
                console.log('Contacts rendered successfully');
            } catch (error) {
                console.error('Failed to load contacts:', error);
                document.getElementById('contactsList').innerHTML = '<div class="text-center p-3 text-danger">Ошибка загрузки контактов: ' + error.message + '</div>';
            }
        }

        // Load pending friend requests
        async function loadPendingRequests() {
            try {
                const response = await fetch('/api/friends/pending');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                let requests = await response.json();
                
                // Ensure requests is an array
                if (!Array.isArray(requests)) {
                    console.warn('Pending requests is not an array:', requests);
                    requests = [];
                }
                
                const pendingSection = document.getElementById('pendingSection');
                const pendingCount = document.getElementById('pendingCount');
                const pendingList = document.getElementById('pendingList');
                
                if (requests.length === 0) {
                    pendingSection.style.display = 'none';
                    return;
                }
                
                pendingCount.textContent = requests.length;
                pendingSection.style.display = 'block';
                
                pendingList.innerHTML = requests.map(request => `
                    <div class="list-group-item d-flex align-items-center justify-content-between border-0 border-bottom mb-1">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle text-primary border d-flex align-items-center justify-content-center" 
                                 style="width: 30px; height: 30px; font-size: 14px;">
                                ${request.first_name.charAt(0).toUpperCase()}
                            </div>
                            <div class="ms-2">
                                <div class="small"><strong>${request.first_name} ${request.last_name}</strong></div>
                                <div class="small text-muted">${request.email}</div>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-success btn-sm me-1" onclick="acceptFriend(${request.user_id})" title="Принять">
                                ✓
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="rejectFriend(${request.user_id})" title="Отклонить">
                                ✗
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load pending requests:', error);
            }
        }

        // Show add friends modal
        function showAddFriends() {
            const modal = new bootstrap.Modal(document.getElementById('addFriendsModal'));
            modal.show();
            
            // Setup search input listener
            const searchInput = document.getElementById('userSearchInput');
            searchInput.value = '';
            searchInput.oninput = function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    if (searchInput.value.trim().length >= 2) {
                        searchUsers(searchInput.value.trim());
                    } else {
                        document.getElementById('searchResults').innerHTML = '<div class="text-center text-muted">Введите минимум 2 символа</div>';
                    }
                }, 300);
            };
        }

        // Search users
        async function searchUsers(query) {
            try {
                const response = await fetch(`/api/friends/search?q=${encodeURIComponent(query)}&limit=10`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                let users = await response.json();
                
                // Ensure users is an array
                if (!Array.isArray(users)) {
                    console.warn('Search results is not an array:', users);
                    users = [];
                }
                
                const searchResults = document.getElementById('searchResults');
                
                if (users.length === 0) {
                    searchResults.innerHTML = '<div class="text-center text-muted">Пользователи не найдены</div>';
                    return;
                }
                
                // Check friendship status for each user
                const usersWithStatus = await Promise.all(users.map(async user => {
                    try {
                        const statusResponse = await fetch(`/api/friends/status?friend_id=${user.id}`);
                        const statusData = await statusResponse.json();
                        return { ...user, friendshipStatus: statusData.status };
                    } catch (error) {
                        console.error('Failed to get friendship status:', error);
                        return { ...user, friendshipStatus: 'none' };
                    }
                }));
                
                searchResults.innerHTML = usersWithStatus.map(user => {
                    let buttonHtml = '';
                    
                    switch (user.friendshipStatus) {
                        case 'pending':
                            buttonHtml = '<button class="btn btn-secondary btn-sm" disabled>Заявка отправлена</button>';
                            break;
                        case 'pending_received':
                            buttonHtml = '<button class="btn btn-warning btn-sm" disabled>Входящая заявка</button>';
                            break;
                        case 'accepted':
                            buttonHtml = '<button class="btn btn-success btn-sm" disabled>Уже друзья</button>';
                            break;
                        default:
                            buttonHtml = `<button class="btn btn-primary btn-sm" onclick="sendFriendRequest(${user.id})">Добавить в друзья</button>`;
                    }
                    
                    return `
                        <div class="list-group-item d-flex align-items-center justify-content-between border-0 border-bottom mb-2">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle text-primary border d-flex align-items-center justify-content-center" 
                                     style="width: 40px; height: 40px;">
                                    ${user.first_name.charAt(0).toUpperCase()}
                                </div>
                                <div class="ms-3">
                                    <strong>${user.first_name} ${user.last_name}</strong>
                                    <div class="small text-muted">${user.email}</div>
                                </div>
                            </div>
                            ${buttonHtml}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Failed to search users:', error);
                document.getElementById('searchResults').innerHTML = '<div class="text-center text-danger">Ошибка поиска</div>';
            }
        }

        // Send friend request
        async function sendFriendRequest(friendId) {
            try {
                const response = await fetch('/api/friends/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        friend_id: friendId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Refresh search results to show updated status
                    const searchInput = document.getElementById('userSearchInput');
                    if (searchInput.value.trim().length >= 2) {
                        await searchUsers(searchInput.value.trim());
                    }
                } else {
                    alert('Ошибка: ' + (data.message || 'Не удалось отправить заявку'));
                }
            } catch (error) {
                console.error('Failed to send friend request:', error);
                alert('Ошибка при отправке заявки');
            }
        }

        // Accept friend request
        async function acceptFriend(friendId) {
            try {
                const response = await fetch('/api/friends/accept', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        friend_id: friendId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    await loadPendingRequests();
                    await loadContacts();
                } else {
                    alert('Ошибка: ' + (data.message || 'Не удалось принять заявку'));
                }
            } catch (error) {
                console.error('Failed to accept friend request:', error);
                alert('Ошибка при принятии заявки');
            }
        }

        // Reject friend request
        async function rejectFriend(friendId) {
            try {
                const response = await fetch('/api/friends/reject', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        friend_id: friendId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    await loadPendingRequests();
                } else {
                    alert('Ошибка: ' + (data.message || 'Не удалось отклонить заявку'));
                }
            } catch (error) {
                console.error('Failed to reject friend request:', error);
                alert('Ошибка при отклонении заявки');
            }
        }

        // Select a contact to chat with
        function selectContact(contactId) {
            const contact = contacts.find(c => c.id === contactId);
            if (!contact) return;
            
            selectedRecipient = contact;
            
            // Update active contact styling
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-contact-id="${contactId}"]`).classList.add('active');
            
            // Update chat header
            document.getElementById('chatAvatar').textContent = contact.first_name.charAt(0).toUpperCase();
            document.getElementById('chatUserName').textContent = `${contact.first_name} ${contact.last_name}`;
            
            // Show chat area
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('chatArea').style.display = 'flex';
            
            // Load messages
            loadMessages();
        }

        // Load messages between current user and selected recipient
        async function loadMessages() {
            if (!selectedRecipient) return;
            
            try {
                const response = await fetch(`/api/messages/between?recipient_id=${selectedRecipient.id}&limit=50&offset=0`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                let messages = await response.json();
                
                // Ensure messages is an array
                if (!Array.isArray(messages)) {
                    console.warn('Messages is not an array:', messages);
                    messages = [];
                }
                
                const messagesArea = document.getElementById('messagesArea');
                
                if (messages.length === 0) {
                    messagesArea.innerHTML = '<div class="text-center text-muted">Начните переписку!</div>';
                    return;
                }
                
                messagesArea.innerHTML = messages.map(message => {
                    const isMyMessage = message.user_id === currentUser.id;
                    const messageClass = isMyMessage ? 'text-end' : 'text-start';
                    const bubbleClass = isMyMessage ? 'bg-primary text-white ms-auto' : 'bg-light text-dark me-auto';
                    
                    return `
                        <div class="mb-3 ${messageClass}">
                            <div class="d-inline-block p-2 rounded ${bubbleClass}" style="max-width: 70%;">
                                <div>${message.text}</div>
                                <div class="small opacity-75 mt-1">
                                    ${new Date(message.created_at).toLocaleString('ru-RU')}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Scroll to bottom
                messagesArea.scrollTop = messagesArea.scrollHeight;
            } catch (error) {
                console.error('Failed to load messages:', error);
                document.getElementById('messagesArea').innerHTML = '<div class="text-center text-danger">Ошибка загрузки сообщений</div>';
            }
        }

        // Send message
        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!selectedRecipient) return;
            
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            
            if (!messageText) return;
            
            try {
                const response = await fetch('/api/messages/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        recipient_id: selectedRecipient.id,
                        text: messageText
                    })
                });
                
                if (response.ok) {
                    messageInput.value = '';
                    await loadMessages(); // Reload messages
                } else {
                    console.error('Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        });

        // Logout function
        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            window.location.href = 'login.html';
        }

        // Auto-refresh messages and pending requests
        setInterval(function() {
            if (selectedRecipient) {
                loadMessages();
            }
            loadPendingRequests(); // Check for new friend requests
        }, 3000);
    </script>
</body>

</html>
