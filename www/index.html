<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система сообщений</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Система сообщений</h1>
    
    <div class="message-form">
      <h2>Создать сообщение</h2>
      <div class="form-group">
        <textarea id="messageText" placeholder="Введите ваше сообщение..."></textarea>
        <button onclick="createMessage()">Отправить</button>
      </div>
    </div>

    <div class="messages-section">
      <h2>Сообщения</h2>
      <button onclick="loadMessages()">Обновить</button>
      <div id="output">Загрузка...</div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
