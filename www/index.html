<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Экран авторизации -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-container">
      <h1>Мессенджер</h1>
      <div class="auth-tabs">
        <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">Вход</button>
        <button id="registerTab" class="tab-btn" onclick="switchTab('register')">Регистрация</button>
      </div>
      
      <!-- Форма входа -->
      <div id="loginForm" class="auth-form">
        <div class="form-group">
          <input type="email" id="loginEmail" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="Пароль" required>
        </div>
        <button onclick="login()">Войти</button>
      </div>
      
      <!-- Форма регистрации -->
      <div id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <input type="text" id="registerFirstName" placeholder="Имя" required>
        </div>
        <div class="form-group">
          <input type="text" id="registerLastName" placeholder="Фамилия" required>
        </div>
        <div class="form-group">
          <input type="email" id="registerEmail" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="registerPassword" placeholder="Пароль" required>
        </div>
        <button onclick="register()">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <!-- Главный экран чата -->
  <div id="chatScreen" class="chat-screen hidden">
    <div class="chat-container">
      <!-- Боковая панель -->
      <div class="sidebar">
        <div class="user-info">
          <div class="user-avatar">👤</div>
          <div class="user-details">
            <div id="currentUserName">Пользователь</div>
            <button onclick="logout()" class="logout-btn">Выйти</button>
          </div>
        </div>
        
        <!-- Поиск друзей -->
        <div class="search-section">
          <input type="text" id="userSearch" placeholder="Поиск пользователей..." onkeyup="searchUsers()">
          <div id="searchResults" class="search-results"></div>
        </div>
        
        <!-- Список друзей -->
        <div class="friends-section">
          <h3>Друзья</h3>
          <div id="friendsList" class="friends-list"></div>
        </div>
        
        <!-- Входящие запросы в друзья -->
        <div class="requests-section">
          <h3>Заявки в друзья</h3>
          <div id="friendRequests" class="friend-requests"></div>
        </div>
      </div>

      <!-- Область чата -->
      <div class="chat-area">
        <div id="chatHeader" class="chat-header">
          <div class="chat-title">Выберите собеседника</div>
        </div>
        
        <div id="messagesContainer" class="messages-container">
          <div class="no-chat-selected">
            Выберите друга из списка, чтобы начать переписку
          </div>
        </div>
        
        <div id="messageForm" class="message-form hidden">
          <div class="form-group">
            <textarea id="messageText" placeholder="Введите сообщение..." rows="2"></textarea>
            <button onclick="sendMessage()">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="scripts.js"></script>
</body>
</html>
